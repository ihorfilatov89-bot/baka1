<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Underwater Liquid Glass - Ultimate Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Базовые цвета (динамические CSS переменные) */
        :root {
            --water-top: #4ba3a5;
            --water-mid: #1d5d74;
            --water-deep: #0b2b3c;
            --water-bottom: #030f16;
        }

        body {
            height: 300vh;
            background: linear-gradient(
                to bottom,
                var(--water-top) 0%,
                var(--water-mid) 20%,
                var(--water-deep) 50%,
                var(--water-bottom) 100%
            );
            overflow-x: hidden;
            position: relative;
            transition: background 0.8s cubic-bezier(0.1, 0.8, 0.3, 1);
        }

        /* Солнечные лучи */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150%;
            height: 100vh;
            background: radial-gradient(circle at 50% -20%, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0) 60%),
                        linear-gradient(45deg, rgba(255,255,255,0) 45%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0) 55%),
                        linear-gradient(-45deg, rgba(255,255,255,0) 40%, rgba(255,255,255,0.1) 48%, rgba(255,255,255,0) 56%);
            background-size: 100% 100%, 200% 100%, 200% 100%;
            pointer-events: none;
            z-index: 1;
            animation: sunlight WaveSunlight 10s infinite linear;
            opacity: 0.8;
        }

        @keyframes WaveSunlight {
            0% { background-position: 50% -20%, 0% 0%, 0% 0%; }
            50% { background-position: 50% -15%, 100% 0%, -50% 0%; }
            100% { background-position: 50% -20%, 200% 0%, -100% 0%; }
        }

        /* Окно авторизации */
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 15, 22, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        .auth-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
            width: 350px;
        }

        .auth-box h2 { color: #fff; margin-bottom: 20px; font-weight: 600; }

        .auth-input {
            width: 100%;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            color: #fff;
            font-size: 16px;
            outline: none;
            margin-bottom: 20px;
            text-align: center;
        }

        .auth-btn {
            background: #ffffff;
            color: #0b2b3c;
            border: none;
            padding: 12px 30px;
            border-radius: 15px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }

        .auth-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,255,255,0.3); }

        /* Профиль игрока "В сети" (Левый верхний угол) */
        .user-status {
            position: fixed;
            top: 15px;
            left: 20px;
            height: 50px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 25px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transform: translateX(-150%);
            transition: transform 0.5s cubic-bezier(0.1, 0.8, 0.3, 1), background 0.3s;
            cursor: pointer;
            user-select: none;
        }

        .user-status:hover {
            background: rgba(255, 255, 255, 0.22);
        }

        /* Кастомная нарисованная аватарка */
        .user-avatar-preview {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            margin-right: 10px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            object-fit: cover;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #2ecc71;
            border-radius: 50%;
            margin-right: 10px;
            box-shadow: 0 0 10px #2ecc71;
        }

        .username-text { color: #fff; font-size: 14px; font-weight: 600; margin-right: 5px;}

        /* Правый верхний угол: Клякса с краской */
        .paint-tool-container {
            position: fixed;
            top: 15px;
            right: 20px;
            z-index: 15;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .paint-icon-btn {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.3s;
        }

        .paint-icon-btn:hover { transform: scale(1.15); background: rgba(255, 255, 255, 0.2); }
        .paint-icon-btn svg { width: 28px; height: 28px; fill: #ffffff; }

        /* Выпадающая расширенная палитра */
        .color-picker-menu {
            margin-top: 10px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            padding: 12px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            opacity: 0;
            transform: translateY(-10px) scale(0.9);
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.1, 0.8, 0.3, 1);
        }

        .color-picker-menu.active { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }

        .color-option {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .color-option:hover { transform: scale(1.2); border-color: #fff; }

        /* Градиенты палитры */
        .theme-blue    { background: linear-gradient(#4ba3a5, #0b2b3c); }
        .theme-red     { background: linear-gradient(#e74c3c, #4a0000); }
        .theme-pink    { background: linear-gradient(#ff758c, #6c0531); }
        .theme-white   { background: linear-gradient(#f4f6f7, #2c3e50); }
        .theme-yellow  { background: linear-gradient(#f1c40f, #7e5109); }
        .theme-green   { background: linear-gradient(#2ecc71, #0b3c1d); }
        .theme-purple  { background: linear-gradient(#9b5de5, #21004a); }

        /* Макбук Хот-бар (Компактный) */
        .mac-hotbar {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            min-width: 500px;
            height: 50px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(25px) saturate(190%);
            -webkit-backdrop-filter: blur(25px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            gap: 20px;
        }

        .play-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 6px 16px;
            border-radius: 14px;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .play-btn:hover { background: rgba(255, 255, 255, 0.4); transform: translateY(-1px); }

        /* Контейнер поиска и выпадающий список результатов */
        .search-container { position: relative; width: 180px; }
        .search-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 12px 6px 32px;
            border-radius: 12px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: all 0.3s;
        }
        .search-input:focus { background: rgba(255, 255, 255, 0.25); }
        .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 13px; height: 13px; color: #fff; opacity: 0.6;}

        .search-results {
            position: absolute;
            top: 45px;
            left: 0;
            width: 220px;
            background: rgba(10, 30, 45, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 6px;
            display: none;
            flex-direction: column;
            gap: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        .search-item {
            color: #fff;
            font-size: 13px;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .search-item:hover { background: rgba(255,255,255,0.15); }
        .search-status-online { width: 6px; height: 6px; background: #2ecc71; border-radius: 50%; box-shadow: 0 0 6px #2ecc71; }

        .fps-counter {
            color: rgba(255, 255, 255, 0.9);
            font-size: 12px;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Центрированная надпись Hallo */
        .main-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            z-index: 5;
        }

        .glass-title-box {
            position: relative;
            padding: 40px 80px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(18px) brightness(1.1);
            -webkit-backdrop-filter: blur(18px) brightness(1.1);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-top: 2px solid rgba(255, 255, 255, 0.4);
            border-left: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: inset 0 20px 30px rgba(255, 255, 255, 0.15), 0 25px 50px rgba(0, 0, 0, 0.2);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; cursor: pointer;
        }

        .glass-title-box::after {
            content: ''; position: absolute;
            top: var(--mouse-y, 50%); left: var(--mouse-x, 50%);
            width: 180px; height: 180px;
            background: radial-gradient(circle, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0.08) 40%, rgba(255,255,255,0) 70%);
            transform: translate(-50%, -50%) scale(0); pointer-events: none;
            transition: transform 0.5s cubic-bezier(0.1, 0.8, 0.3, 1); z-index: 1;
        }
        .glass-title-box:hover::after { transform: translate(-50%, -50%) scale(1.5); }

        .glass-title-box h1 {
            font-size: 96px; font-weight: 800; letter-spacing: 2px; color: transparent;
            background: linear-gradient(135deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0.6) 100%);
            -webkit-background-clip: text; background-clip: text;
            filter: drop-shadow(0px 4px 15px rgba(255, 255, 255, 0.25)); text-shadow: 0px 0px 1px rgba(255,255,255,0.5);
            user-select: none; position: relative; z-index: 2; transition: 0.3s ease;
        }
        .glass-title-box:hover h1 { transform: scale(1.02); skewX(-1deg); }

        /* Окно настроек профиля (Модалка) */
        .profile-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 110;
            display: none;
            align-items: center; justify-content: center;
        }
        .profile-box {
            background: rgba(15, 32, 45, 0.9);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 24px;
            width: 400px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            color: #fff;
        }
        .profile-box h3 { margin-bottom: 15px; font-weight: 600; text-align: center; }
        
        .warning-text {
            background: rgba(241, 196, 15, 0.15);
            border-left: 4px solid #f1c40f;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            color: #f1c40f;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .canvas-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
        }
        .canvas-label { font-size: 13px; color: rgba(255,255,255,0.7); margin-bottom: 6px; }
        
        /* Холст для рисования авы */
        #avatarCanvas {
            background: #112233;
            border: 2px dashed rgba(255,255,255,0.3);
            border-radius: 50%;
            cursor: crosshair;
        }
        .canvas-btns { display: flex; gap: 10px; margin-top: 8px; }
        .mini-btn {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; padding: 4px 10px; border-radius: 6px; font-size: 11px; cursor: pointer;
        }
        .mini-btn:hover { background: rgba(255,255,255,0.2); }

        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .cancel-btn { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 8px 16px; border-radius: 10px; cursor: pointer; }
        .save-btn { background: #fff; border: none; color: #0b2b3c; padding: 8px 16px; border-radius: 10px; font-weight: 600; cursor: pointer; }

        .scroll-hint {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.4); font-size: 11px; text-transform: uppercase; letter-spacing: 2px;
            z-index: 5; animation: pulse 2s infinite; pointer-events: none;
        }
        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.8; } }
    </style>
</head>
<body>

    <!-- Окно авторизации -->
    <div class="auth-overlay" id="authOverlay">
        <div class="auth-box">
            <h2>Введите ваш никнейм</h2>
            <input type="text" id="nicknameInput" class="auth-input" placeholder="Имя игрока..." maxlength="12" autocomplete="off">
            <button class="auth-btn" id="startBtn">Войти в систему</button>
        </div>
    </div>

    <!-- Модальное окно настройки профиля -->
    <div class="profile-modal" id="profileModal">
        <div class="profile-box">
            <h3>Настройка профиля</h3>
            
            <!-- Предупреждение и лимит смены ника -->
            <div class="warning-text">
                <strong>Внимание!</strong> Вы можете изменить имя пользователя <strong>всего 2 раза</strong>. Выбирайте обдуманно.
            </div>
            
            <div style="margin-bottom: 15px;">
                <label style="font-size: 13px; display:block; margin-bottom: 5px;" id="changesLeftLabel">Осталось смен: 2</label>
                <input type="text" id="editNameInput" class="auth-input" style="margin-bottom:0;" maxlength="12">
            </div>

            <!-- Рисование аватарки -->
            <div class="canvas-container">
                <span class="canvas-label">Нарисуйте вашу аватарку ниже:</span>
                <canvas id="avatarCanvas" width="120" height="120"></canvas>
                <div class="canvas-btns">
                    <button class="mini-btn" id="clearCanvasBtn">Очистить</button>
                </div>
            </div>

            <div class="modal-footer">
                <button class="cancel-btn" id="closeProfileBtn">Отмена</button>
                <button class="save-btn" id="saveProfileBtn">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- Левый угол: Профиль игрока -->
    <div class="user-status" id="userStatus" title="Нажмите, чтобы настроить профиль">
        <!-- Сюда будет рендериться нарисованная аватарка -->
        <canvas id="avatarPreview" class="user-avatar-preview" width="32" height="32"></canvas>
        <div class="status-dot"></div>
        <div class="username-text" id="usernameDisplay">Player</div>
    </div>

    <!-- Правый угол: Смена цветов (Клякса) -->
    <div class="paint-tool-container">
        <div class="paint-icon-btn" id="paintBtn" title="Сменить цвет океана">
            <!-- SVG Иконка кляксы краски -->
            <svg viewBox="0 0 24 24">
                <path d="M12,2A10,10 0 0,0 2,12C2,16.58 5.11,20.44 9.27,21.54C9.1,20.7 9,19.84 9,19C9,15.13 12.13,12 16,12C16.84,12 17.7,12.1 18.54,12.27C19.64,16.43 15.78,19.56 12,19.56C11.56,19.56 11.13,19.53 10.72,19.46C10.26,20.44 9.25,21.17 8.08,21.4C10.13,21.79 11.42,22 12,22A10,10 0 0,0 22,12C22,6.47 17.5,2 12,2M16,6A1.5,1.5 0 0,1 17.5,7.5A1.5,1.5 0 0,1 16,9A1.5,1.5 0 0,1 14.5,7.5A1.5,1.5 0 0,1 16,6M11,5A1.5,1.5 0 0,1 12.5,6.5A1.5,1.5 0 0,1 11,8A1.5,1.5 0 0,1 9.5,6.5A1.5,1.5 0 0,1 11,5M7,8A1.5,1.5 0 0,1 8.5,9.5A1.5,1.5 0 0,1 7,11A1.5,1.5 0 0,1 5.5,9.5A1.5,1.5 0 0,1 7,8M7,14A1.5,1.5 0 0,1 8.5,15.5A1.5,1.5 0 0,1 7,17A1.5,1.5 0 0,1 5.5,15.5A1.5,1.5 0 0,1 7,14Z" />
            </svg>
        </div>
        
        <!-- Меню с палитрами: красный, розовый, белый, желтый, зеленый, фиолетовый/синий -->
        <div class="color-picker-menu" id="colorMenu">
            <div class="color-option theme-blue" data-top="#4ba3a5" data-mid="#1d5d74" data-deep="#0b2b3c" data-bottom="#030f16" title="Классический"></div>
            <div class="color-option theme-red" data-top="#e74c3c" data-mid="#922b21" data-deep="#641e16" data-bottom="#1a0505" title="Красный"></div>
            <div class="color-option theme-pink" data-top="#ff758c" data-mid="#c71585" data-deep="#7d053f" data-bottom="#250010" title="Розовый"></div>
            <div class="color-option theme-white" data-top="#eaeded" data-mid="#a6acaf" data-deep="#5d6d7e" data-bottom="#1a252f" title="Белый"></div>
            <div class="color-option theme-yellow" data-top="#f1c40f" data-mid="#b7950b" data-deep="#7e5109" data-bottom="#281802" title="Жёлтый"></div>
            <div class="color-option theme-green" data-top="#2ecc71" data-mid="#1f9e55" data-deep="#115e33" data-bottom="#052512" title="Зелёный"></div>
            <div class="color-option theme-purple" data-top="#9b5de5" data-mid="#6a1b9a" data-deep="#4a148c" data-bottom="#120024" title="Фиолетовый"></div>
        </div>
    </div>

    <!-- Макбук Хот-бар -->
    <header class="mac-hotbar">
        <button class="play-btn">Играть</button>
        
        <!-- Поиск -->
        <div class="search-container">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" class="search-input" id="searchInput" placeholder="Поиск игрока...">
            
            <!-- Выпадающее меню поиска -->
            <div class="search-results" id="searchResults"></div>
        </div>
        
        <div class="fps-counter" id="fps">FPS: --</div>
    </header>

    <!-- Главная надпись Hallo -->
    <div class="main-container">
        <div class="glass-title-box" id="glassBox">
            <h1>Hallo</h1>
        </div>
    </div>

    <div class="scroll-hint">Листай вниз, чтобы погрузиться глубже</div>

    <script>
        // Имитация базы игроков для поиска
        const playersDatabase = ["Alex", "Admin", "Max", "Shark", "Neo", "Dolphin", "Bro", "CrazyFish", "Gamer123", "Kraken"];

        // Глобальные переменные профиля
        let nickname = "Player";
        let nicknameChangesLeft = 2;

        const authOverlay = document.getElementById('authOverlay');
        const nicknameInput = document.getElementById('nicknameInput');
        const startBtn = document.getElementById('startBtn');
        const userStatus = document.getElementById('userStatus');
        const usernameDisplay = document.getElementById('usernameDisplay');

        // Модалка редактирования профиля
        const profileModal = document.getElementById('profileModal');
        const editNameInput = document.getElementById('editNameInput');
        const changesLeftLabel = document.getElementById('changesLeftLabel');
        const closeProfileBtn = document.getElementById('closeProfileBtn');
        const saveProfileBtn = document.getElementById('saveProfileBtn');

        // Рисование (Canvas)
        const canvas = document.getElementById('avatarCanvas');
        const ctx = canvas.getContext('2d');
        const previewCanvas = document.getElementById('avatarPreview');
        const pCtx = previewCanvas.getContext('2d');
        const clearCanvasBtn = document.getElementById('clearCanvasBtn');
        let isDrawing = false;

        // Заливка холста по умолчанию (просто фон)
        function initCanvas() {
            ctx.fillStyle = '#112233';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            updatePreview();
        }

        // Рисование на аватарке
        canvas.addEventListener('mousedown', () => isDrawing = true);
        canvas.addEventListener('mouseup', () => { isDrawing = false; ctx.beginPath(); });
        canvas.addEventListener('mousemove', draw);

        function draw(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#ffffff'; // Рисуем белым цветом «жидкого» неона

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        clearCanvasBtn.addEventListener('click', initCanvas);

        function updatePreview() {
            pCtx.clearRect(0, 0, 32, 32);
            pCtx.drawImage(canvas, 0, 0, 120, 120, 0, 0, 32, 32);
        }

        // Логика первого входа
        function submitNickname() {
            const name = nicknameInput.value.trim();
            if (name.length > 0) {
                nickname = name;
                authOverlay.style.opacity = '0';
                setTimeout(() => authOverlay.style.display = 'none', 500);
                
                usernameDisplay.textContent = nickname;
                userStatus.style.transform = 'translateX(0)';
                initCanvas();
            }
        }

        startBtn.addEventListener('click', submitNickname);
        nicknameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitNickname(); });

        // Открытие настроек профиля
        userStatus.addEventListener('click', () => {
            editNameInput.value = nickname;
            changesLeftLabel.textContent = `Осталось смен: ${nicknameChangesLeft}`;
            if (nicknameChangesLeft <= 0) {
                editNameInput.disabled = true;
            }
            profileModal.style.display = 'flex';
        });

        closeProfileBtn.addEventListener('click', () => profileModal.style.display = 'none');

        // Сохранение изменений профиля
        saveProfileBtn.addEventListener('click', () => {
            const newName = editNameInput.value.trim();
            
            if (newName.length > 0 && newName !== nickname && nicknameChangesLeft > 0) {
                nickname = newName;
                nicknameChangesLeft--;
                usernameDisplay.textContent = nickname;
            }
            
            updatePreview();
            profileModal.style.display = 'none';
        });

        // --- Поиск людей в реальном времени ---
        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');

        searchInput.addEventListener('input', () => {
            const query = searchInput.value.trim().toLowerCase();
            searchResults.innerHTML = '';
            
            if (query.length === 0) {
                searchResults.style.display = 'none';
                return;
            }

            // Фильтруем виртуальную БД
            const matches = playersDatabase.filter(p => p.toLowerCase().includes(query));

            if (matches.length > 0) {
                matches.forEach(player => {
                    const item = document.createElement('div');
                    item.className = 'search-item';
                    item.innerHTML = `<span>${player}</span><span class="search-status-online"></span>`;
                    
                    // Клик на найденного человека подставляет его имя в поиск
                    item.addEventListener('click', () => {
                        searchInput.value = player;
                        searchResults.style.display = 'none';
                    });
                    searchResults.appendChild(item);
                });
                searchResults.style.display = 'flex';
            } else {
                searchResults.innerHTML = `<div class="search-item" style="color:rgba(255,255,255,0.4); cursor:default;">Никто не найден</div>`;
                searchResults.style.display = 'flex';
            }
        });

        // Закрывать поиск если кликнули вне его
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-container')) {
                searchResults.style.display = 'none';
            }
        });

        // --- Управление цветом фона (Клякса) ---
        const paintBtn = document.getElementById('paintBtn');
        const colorMenu = document.getElementById('colorMenu');
        const root = document.documentElement;

        paintBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            colorMenu.classList.toggle('active');
        });

        document.addEventListener('click', () => colorMenu.classList.remove('active'));

        document.querySelectorAll('.color-option').forEach(option => {
            option.addEventListener('click', (e) => {
                root.style.setProperty('--water-top', e.target.getAttribute('data-top'));
                root.style.setProperty('--water-mid', e.target.getAttribute('data-mid'));
                root.style.setProperty('--water-deep', e.target.getAttribute('data-deep'));
                root.style.setProperty('--water-bottom', e.target.getAttribute('data-bottom'));
            });
        });

        // --- Эффект плавления на надписи ---
        const glassBox = document.getElementById('glassBox');
        glassBox.addEventListener('mousemove', (e) => {
            const rect = glassBox.getBoundingClientRect();
            glassBox.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
            glassBox.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
        });

        // --- FPS Счетчик ---
        const fpsElement = document.getElementById('fps');
        let frameCount = 0;
        let lastTime = performance.now();

        function countFPS() {
            frameCount++;
            const now = performance.now();
            if (now >= lastTime + 1000) {
                const fps = Math.round((frameCount * 1000) / (now - lastTime));
                fpsElement.textContent = `FPS: ${fps}`;
                frameCount = 0;
                lastTime = now;
            }
            requestAnimationFrame(countFPS);
        }
        requestAnimationFrame(countFPS);
    </script>
</body>
</html>
